site_name: tidal-insar-sim
site_description: DDInSAR fringe-count simulator for tidally flexed grounding zones
site_author: Pietro Milillo
repo_url: https://github.com/pmilillo/tidal-insar-sim
repo_name: pmilillo/tidal-insar-sim

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.share
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Constellations: constellations.md
  - Physics: physics.md
  - CATS2008 setup: cats2008_setup.md
  - API reference: api.md
  - Examples:
      - Single-site analysis: examples/01_single_site.md
      - Acquisition planning: examples/02_acquisition_planning.md
      - Batch comparison: examples/03_batch_comparison.md
      - Web app walkthrough: examples/04_web_app_walkthrough.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pmilillo/tidal-insar-sim

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
