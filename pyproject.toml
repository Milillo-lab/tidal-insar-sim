[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tidal-insar-sim"
dynamic = ["version"]
description = "DDInSAR fringe-count simulator for tidally flexed grounding zones"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pietro Milillo" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pandas>=2.2",
    "icalendar>=6.0",
]

[project.optional-dependencies]
tides = [
    "pyTMD>=3.0",
    "pyproj>=3.6",
    "netCDF4>=1.6",
]
geo = [
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
]
cli = [
    "click>=8.1",
    "rich>=13.7",
]
web = [
    "streamlit>=1.32",
    "folium>=0.15",
    "streamlit-folium>=0.18",
    "matplotlib>=3.8",
]
batch = [
    "pandas>=2.2",
    "pyarrow>=15",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-xdist>=3",
    "mypy>=1.9",
    "ruff>=0.3",
]

[project.scripts]
tidal-insar-sim = "tidal_insar_sim.cli.main:cli"

[tool.hatch.version]
path = "tidal_insar_sim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tidal_insar_sim"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",  # Too many arguments — physics functions need many parameters
    "PLR2004",  # Magic value in comparison — common in physics/tests against published values
    "PLC0415",  # Local imports — intentional (lazy-load pyTMD, avoid circular deps)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # test_<Thing>_... matches physics-symbol naming (e.g. test_rigidity_D)

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "cats: requires CATS2008 data installed (skipped in CI by default)",
    "slow: marks slow tests",
]
